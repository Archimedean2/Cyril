name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test, coverage, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Lint runs but does not block yet (~50 warnings to burn down).
      # Flip continue-on-error to false once the warning backlog is cleared.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit & integration tests
        run: npm run test

      # Coverage is REPORT-ONLY for now (baseline ~70% lines / ~51% functions).
      # Re-enable the hard threshold once function coverage is raised and the
      # suite is trusted. See NEXT_STEPS.md.
      - name: Coverage (report only)
        run: npm run test:coverage

      - name: Feature coverage report
        run: npm run coverage:features

      # Blocking (BACKLOG C-31): the committed FEATURE_COVERAGE.md is a generated
      # convenience, not the gate — CI is the real enforcement. This regenerates the ledger
      # from the checked-out (merged) tree and fails if any non-e2e criterion is 'failing'
      # or has no matching test, so a stale committed copy from a merge/cherry-pick can
      # never mask a real regression. Never "fix" a conflict on FEATURE_COVERAGE.md by
      # picking a side — always regenerate (see docs/testing/TESTING.md).
      - name: Feature coverage gate (fails on regression)
        run: npm run coverage:features -- --check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
