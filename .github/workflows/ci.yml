name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. Restricting this to `branches: [main]`
  # meant a stacked PR (one whose base is another feature branch) got no CI at all.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, lint, test, coverage, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cheap insurance against committing a build artefact or a raw corpus.
      # The generated word indexes are ~9 MB and ~24 MB and the ConceptNet dump is
      # ~500 MB; a stray `git add -A` on a branch without the current .gitignore
      # will otherwise push them. GitHub hard-rejects >100 MB, but smaller ones
      # would sail through and bloat the repo permanently.
      - name: Reject oversized files
        run: |
          # 5 MB: the largest legitimate tracked file is stress-dict.json at ~1.8 MB,
          # and the artefacts we want to catch start at ~9 MB.
          big=$(git ls-files -z | xargs -0 -r du -k 2>/dev/null | awk '$1 > 5120 {print $1"K\t"$2}')
          if [ -n "$big" ]; then
            echo "Files over 5 MB are tracked:"; echo "$big"
            echo "If one is legitimate, raise the threshold in this step deliberately."
            exit 1
          fi
          echo "No tracked file exceeds 5 MB."

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm run test

      # Coverage is REPORT-ONLY for now (baseline ~70% lines / ~51% functions).
      # Re-enable the hard threshold once function coverage is raised and the
      # suite is trusted. See NEXT_STEPS.md.
      - name: Coverage (report only)
        run: npm run test:coverage

      - name: Feature coverage report
        run: npm run coverage:features

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
