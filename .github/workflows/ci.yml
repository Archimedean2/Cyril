name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. Restricting this to `branches: [main]`
  # meant a stacked PR (one whose base is another feature branch) got no CI at all.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, lint, test, coverage, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm run test

      # Coverage is REPORT-ONLY for now (baseline ~70% lines / ~51% functions).
      # Re-enable the hard threshold once function coverage is raised and the
      # suite is trusted. See NEXT_STEPS.md.
      - name: Coverage (report only)
        run: npm run test:coverage

      - name: Feature coverage report
        run: npm run coverage:features

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
